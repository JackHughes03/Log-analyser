<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://cdn.tailwindcss.com"></script>
    <title>Log Analyser Report</title>
</head>

<body class="bg-gray-900 text-white">
    <h1 class="text-2xl font-bold bg-white/10 p-8">
        Log analyser report -
        <span id="report-date"></span>
    </h1>

    <section class="gap-4 mt-20">
        <h2 class="text-xl text-center font-bold mt-10">Overview</h2>

        <div class="flex flex-wrap gap-4 mt-4 mx-auto items-center justify-center">
            <div class="bg-red-700 px-10 py-6 rounded font-semibold">IPs: <span id="ip-count"></span></div>
            <div class="bg-blue-700 px-10 py-6 rounded font-semibold">Requests: <span id="request-count"></span></div>
            <div class="bg-green-700 px-10 py-6 rounded font-semibold">Codes: <span id="error-count"></span></div>
            <div class="bg-yellow-700 px-10 py-6 rounded font-semibold">Assets: <span id="time-count"></span></div>
        </div>
    </section>

    <div class="max-w-2xl mx-auto space-y-4 mt-20 px-4">
        <!-- IPs Section -->
        <section>
            <details class="bg-white/10 rounded-lg group">
                <summary class="px-4 py-3 cursor-pointer duration-100 hover:bg-white/10">
                    <div class="inline-flex items-center gap-1">
                        View IPs
                    </div>
                </summary>
                <div class="px-4 py-2 border-b border-white/10">
                    <div class="grid grid-cols-2 text-sm font-semibold text-gray-400">
                        <div>IP Address</div>
                        <div class="text-right">Requests</div>
                    </div>
                </div>
                <div id="ip-list" class="px-4 py-2 space-y-1 text-sm text-gray-300">
                    <!-- IP items will be inserted here -->
                </div>
                <div class="px-4 py-3 text-center">
                    <button id="load-more-ips"
                        class="px-4 py-2 bg-blue-700 hover:bg-blue-600 rounded text-sm hidden transition-colors duration-200">
                        Load More IPs
                    </button>
                </div>
            </details>
        </section>

        <!-- Response Codes Section -->
        <section>
            <details class="bg-white/10 rounded-lg group">
                <summary class="px-4 py-3 cursor-pointer duration-100 hover:bg-white/10">
                    <div class="inline-flex items-center gap-1">
                        View Response Codes
                    </div>
                </summary>
                <div class="px-4 py-2 border-b border-white/10">
                    <div class="grid grid-cols-2 text-sm font-semibold text-gray-400">
                        <div>Code</div>
                        <div class="text-right">Count</div>
                    </div>
                </div>
                <div id="codes-list" class="px-4 py-2 space-y-1 text-sm text-gray-300">
                    <!-- Code items will be inserted here -->
                </div>
                <div class="px-4 py-3 text-center">
                    <button id="load-more-codes"
                        class="px-4 py-2 bg-blue-700 hover:bg-blue-600 rounded text-sm hidden transition-colors duration-200">
                        Load More Codes
                    </button>
                </div>
            </details>
        </section>

        <!-- Files Section -->
        <section>
            <details class="bg-white/10 rounded-lg group">
                <summary class="px-4 py-3 cursor-pointer duration-100 hover:bg-white/10">
                    <div class="inline-flex items-center gap-1">
                        View Files
                    </div>
                </summary>
                <div class="px-4 py-2 border-b border-white/10">
                    <div class="grid grid-cols-3 text-sm font-semibold text-gray-400">
                        <div class="col-span-2">File</div>
                        <div class="text-right">Count</div>
                    </div>
                </div>
                <div id="files-list" class="px-4 py-2 space-y-1 text-sm text-gray-300">
                    <!-- File items will be inserted here -->
                </div>
                <div class="px-4 py-3 text-center">
                    <button id="load-more-files"
                        class="px-4 py-2 bg-blue-700 hover:bg-blue-600 rounded text-sm hidden transition-colors duration-200">
                        Load More Files
                    </button>
                </div>
            </details>
        </section>

        <!-- Tools Section -->
        <section>
            <details class="bg-white/10 rounded-lg group">
                <summary class="px-4 py-3 cursor-pointer duration-100 hover:bg-white/10">
                    <div class="inline-flex items-center gap-1">
                        View Tools
                    </div>
                </summary>
                <div class="px-4 py-2 border-b border-white/10">
                    <div class="grid grid-cols-2 text-sm font-semibold text-gray-400">
                        <div>Tool</div>
                        <div class="text-right">Count</div>
                    </div>
                </div>
                <div id="tools-list" class="px-4 py-2 space-y-1 text-sm text-gray-300">
                    <!-- Tool items will be inserted here -->
                </div>
                <div class="px-4 py-3 text-center">
                    <button id="load-more-tools"
                        class="px-4 py-2 bg-blue-700 hover:bg-blue-600 rounded text-sm hidden transition-colors duration-200">
                        Load More Tools
                    </button>
                </div>
            </details>
        </section>

        <!-- Traffic Section -->
        <section>
            <details class="bg-white/10 rounded-lg group">
                <summary class="px-4 py-3 cursor-pointer duration-100 hover:bg-white/10">
                    <div class="inline-flex items-center gap-1">
                        View Traffic
                    </div>
                </summary>
                <div class="px-4 py-2 border-b border-white/10">
                    <div class="grid grid-cols-2 text-sm font-semibold text-gray-400">
                        <div>Time</div>
                        <div class="text-right">Count</div>
                    </div>
                </div>
                <div id="traffic-list" class="px-4 py-2 space-y-1 text-sm text-gray-300">
                    <!-- Traffic items will be inserted here -->
                </div>
                <div class="px-4 py-3 text-center">
                    <button id="load-more-traffic"
                        class="px-4 py-2 bg-blue-700 hover:bg-blue-600 rounded text-sm hidden transition-colors duration-200">
                        Load More Traffic
                    </button>
                </div>
            </details>
        </section>
    </div>

    <script>
        function sortDataByCount(data, type) {
            switch (type) {
                case 'ips':
                    return data.sort((a, b) => b.requests - a.requests);
                case 'codes':
                case 'tools':
                case 'traffic':
                    return data.sort((a, b) => b.count - a.count);
                case 'files':
                    return data.sort((a, b) => b.count - a.count);
                default:
                    return data;
            }
        }

        function loadMoreItems(type, listElement, loadMoreButton) {
            const data = currentData[type];
            const sortedItems = sortDataByCount([...data.items], type);
            const startIndex = data.index;
            const endIndex = Math.min(startIndex + ITEMS_PER_PAGE, sortedItems.length);

            for (let i = startIndex; i < endIndex; i++) {
                const item = sortedItems[i];
                const li = document.createElement('li');
                li.className = 'py-2 px-4 list-none hover:bg-white/5 transition-all duration-200 border-b border-white/10';

                switch (type) {
                    case 'ips':
                        li.innerHTML = `
                            <div class="grid grid-cols-2" onclick="window.open('https://whatismyipaddress.com/ip/${item.ip}', '_blank')">
                                <div>IP: ${item.ip}</div>
                                <div class="text-right">${item.requests}</div>
                            </div>
                        `;
                        break;
                    case 'codes':
                        li.innerHTML = `
                            <div class="grid grid-cols-2">
                                <div>Code: ${item.code}</div>
                                <div class="text-right">${item.count}</div>
                            </div>
                        `;
                        break;
                    case 'files':
                        li.innerHTML = `
                            <div class="grid grid-cols-3">
                                <div class="col-span-2">File: ${item.file}</div>
                                <div class="text-right">${item.count}</div>
                            </div>
                        `;
                        break;
                    case 'tools':
                        li.innerHTML = `
                            <div class="grid grid-cols-2">
                                <div>Tool: ${item.tool}</div>
                                <div class="text-right">${item.count}</div>
                            </div>
                        `;
                        break;
                    case 'traffic':
                        li.innerHTML = `
                            <div class="grid grid-cols-2">
                                <div>Time: ${item.time}</div>
                                <div class="text-right">${item.count}</div>
                            </div>
                        `;
                        break;
                }

                listElement.appendChild(li);
            }

            data.index = endIndex;

            if (endIndex >= sortedItems.length) {
                loadMoreButton.classList.add('hidden');
            }
        }

        const ipCount = document.getElementById('ip-count');
        const requestCount = document.getElementById('request-count');
        const errorCount = document.getElementById('error-count');
        const timeCount = document.getElementById('time-count');
        const reportDate = document.getElementById('report-date');

        const ipList = document.getElementById('ip-list');
        const codesList = document.getElementById('codes-list');
        const filesList = document.getElementById('files-list');
        const toolsList = document.getElementById('tools-list');
        const trafficList = document.getElementById('traffic-list');

        const loadMoreIPs = document.getElementById('load-more-ips');
        const loadMoreCodes = document.getElementById('load-more-codes');
        const loadMoreFiles = document.getElementById('load-more-files');
        const loadMoreTools = document.getElementById('load-more-tools');
        const loadMoreTraffic = document.getElementById('load-more-traffic');

        const ITEMS_PER_PAGE = 100;
        let currentData = {
            ips: { items: [], index: 0 },
            codes: { items: [], index: 0 },
            files: { items: [], index: 0 },
            tools: { items: [], index: 0 },
            traffic: { items: [], index: 0 }
        };

        // Load data from embedded JSON
        const statsData = STATS_JSON_DATA;
        const ipsData = IPS_JSON_DATA;
        const codesData = CODES_JSON_DATA;
        const filesData = FILES_JSON_DATA;
        const toolsData = TOOLS_JSON_DATA;
        const trafficData = TRAFFIC_JSON_DATA;

        // Update stats
        ipCount.innerText = statsData.ip_count.toLocaleString();
        requestCount.innerText = statsData.request_count.toLocaleString();
        errorCount.innerText = statsData.error_count.toLocaleString();
        timeCount.innerText = statsData.asset_count.toLocaleString();
        reportDate.innerText = statsData.report_date;

        // Load data into current data object
        currentData.ips.items = ipsData;
        currentData.codes.items = codesData;
        currentData.files.items = filesData;
        currentData.tools.items = toolsData;
        currentData.traffic.items = trafficData;

        // Initial load of items
        loadMoreItems('ips', ipList, loadMoreIPs);
        loadMoreItems('codes', codesList, loadMoreCodes);
        loadMoreItems('files', filesList, loadMoreFiles);
        loadMoreItems('tools', toolsList, loadMoreTools);
        loadMoreItems('traffic', trafficList, loadMoreTraffic);

        // Show load more buttons if needed
        if (ipsData.length > ITEMS_PER_PAGE) loadMoreIPs.classList.remove('hidden');
        if (codesData.length > ITEMS_PER_PAGE) loadMoreCodes.classList.remove('hidden');
        if (filesData.length > ITEMS_PER_PAGE) loadMoreFiles.classList.remove('hidden');
        if (toolsData.length > ITEMS_PER_PAGE) loadMoreTools.classList.remove('hidden');
        if (trafficData.length > ITEMS_PER_PAGE) loadMoreTraffic.classList.remove('hidden');

        // Add event listeners
        loadMoreIPs.addEventListener('click', () => loadMoreItems('ips', ipList, loadMoreIPs));
        loadMoreCodes.addEventListener('click', () => loadMoreItems('codes', codesList, loadMoreCodes));
        loadMoreFiles.addEventListener('click', () => loadMoreItems('files', filesList, loadMoreFiles));
        loadMoreTools.addEventListener('click', () => loadMoreItems('tools', toolsList, loadMoreTools));
        loadMoreTraffic.addEventListener('click', () => loadMoreItems('traffic', trafficList, loadMoreTraffic));
    </script>
</body>

</html>
