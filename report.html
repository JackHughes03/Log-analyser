<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://cdn.tailwindcss.com"></script>
    <title>Log Analyser Report</title>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Lato:ital,wght@0,100;0,300;0,400;0,700;0,900;1,100;1,300;1,400;1,700;1,900&family=Mulish:ital,wght@0,200..1000;1,200..1000&family=Roboto:ital,wght@0,100;0,300;0,400;0,500;0,700;0,900;1,100;1,300;1,400;1,500;1,700;1,900&display=swap');

        body {
            font-family: 'Mulish', sans-serif;
        }

        details > summary {
            list-style: none;
        }
        details > summary::-webkit-details-marker {
            display: none;
        }
    </style>
</head>

<body class="bg-gray-900 text-white">
    <h1 class="text-2xl font-bold bg-white/10 p-8">
        Log analyser report -
        <span id="report-date"></span>
    </h1>

    <section class="gap-4 mt-20">
        <h2 class="text-xl text-center font-bold mt-10">Overview</h2>

        <div class="flex flex-wrap gap-4 mt-4 mx-auto items-center justify-center">
            <div class="bg-red-700 px-10 py-6 rounded font-semibold">IPs: <span id="ip-count"></span></div>
            <div class="bg-blue-700 px-10 py-6 rounded font-semibold">Requests: <span id="request-count"></span></div>
            <div class="bg-green-700 px-10 py-6 rounded font-semibold">Codes: <span id="error-count"></span></div>
            <div class="bg-yellow-700 px-10 py-6 rounded font-semibold">Assets: <span id="time-count"></span></div>
        </div>
    </section>

    <div class="max-w-2xl mx-auto space-y-8 mt-20 px-4">
        <!-- IPs Section -->
        <section>
            <details class="bg-white/5 rounded-lg group">
                <summary class="px-4 py-3 cursor-pointer duration-100 hover:bg-white/10">
                    <div class="inline-flex items-center gap-1">
                        <svg class="w-4 h-4 -ml-1 rotate-0 transform duration-200 group-open:rotate-90" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7" />
                        </svg>
                        View All IPs
                    </div>
                </summary>
                <div class="px-4 py-2 border-b border-white/10">
                    <div class="grid grid-cols-2 text-sm font-semibold text-gray-400">
                        <div>IP Address</div>
                        <div class="text-right">Requests</div>
                    </div>
                </div>
                <div id="ip-list" class="px-4 py-2 space-y-1 text-sm text-gray-300"></div>
                <div class="px-4 py-3 text-center">
                    <button id="load-more-ips" class="px-4 py-2 bg-blue-700 hover:bg-blue-600 rounded text-sm hidden transition-colors duration-200">
                        Load More IPs
                    </button>
                </div>
            </details>
        </section>

        <!-- Response Codes Section -->
        <section>
            <details class="bg-white/5 rounded-lg group">
                <summary class="px-4 py-3 cursor-pointer duration-100 hover:bg-white/10">
                    <div class="inline-flex items-center gap-1">
                        <svg class="w-4 h-4 -ml-1 rotate-0 transform duration-200 group-open:rotate-90" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7" />
                        </svg>
                        View Response Codes
                    </div>
                </summary>
                <div class="px-4 py-2 border-b border-white/10">
                    <div class="grid grid-cols-2 text-sm font-semibold text-gray-400">
                        <div>Response Code</div>
                        <div class="text-right">Occurrences</div>
                    </div>
                </div>
                <div id="codes-list" class="px-4 py-2 space-y-1 text-sm text-gray-300"></div>
                <div class="px-4 py-3 text-center">
                    <button id="load-more-codes" class="px-4 py-2 bg-blue-700 hover:bg-blue-600 rounded text-sm hidden transition-colors duration-200">
                        Load More Codes
                    </button>
                </div>
            </details>
        </section>

        <!-- Requested Files Section -->
        <section>
            <details class="bg-white/5 rounded-lg group">
                <summary class="px-4 py-3 cursor-pointer duration-100 hover:bg-white/10">
                    <div class="inline-flex items-center gap-1">
                        <svg class="w-4 h-4 -ml-1 rotate-0 transform duration-200 group-open:rotate-90" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7" />
                        </svg>
                        View Requested Files
                    </div>
                </summary>
                <div class="px-4 py-2 border-b border-white/10">
                    <div class="grid grid-cols-3 text-sm font-semibold text-gray-400">
                        <div class="col-span-2">File Path</div>
                        <div class="text-right">Requests</div>
                    </div>
                </div>
                <div id="files-list" class="px-4 py-2 space-y-1 text-sm text-gray-300"></div>
                <div class="px-4 py-3 text-center">
                    <button id="load-more-files" class="px-4 py-2 bg-blue-700 hover:bg-blue-600 rounded text-sm hidden transition-colors duration-200">
                        Load More Files
                    </button>
                </div>
            </details>
        </section>

        <!-- Tools Section -->
        <section>
            <details class="bg-white/5 rounded-lg group">
                <summary class="px-4 py-3 cursor-pointer duration-100 hover:bg-white/10">
                    <div class="inline-flex items-center gap-1">
                        <svg class="w-4 h-4 -ml-1 rotate-0 transform duration-200 group-open:rotate-90" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7" />
                        </svg>
                        View Tools
                    </div>
                </summary>
                <div class="px-4 py-2 border-b border-white/10">
                    <div class="grid grid-cols-2 text-sm font-semibold text-gray-400">
                        <div>Tool Name</div>
                        <div class="text-right">Uses</div>
                    </div>
                </div>
                <div id="tools-list" class="px-4 py-2 space-y-1 text-sm text-gray-300"></div>
                <div class="px-4 py-3 text-center">
                    <button id="load-more-tools" class="px-4 py-2 bg-blue-700 hover:bg-blue-600 rounded text-sm hidden transition-colors duration-200">
                        Load More Tools
                    </button>
                </div>
            </details>
        </section>

        <!-- Traffic Analysis Section -->
        <section class="mb-20">
            <details class="bg-white/5 rounded-lg group">
                <summary class="px-4 py-3 cursor-pointer duration-100 hover:bg-white/10">
                    <div class="inline-flex items-center gap-1">
                        <svg class="w-4 h-4 -ml-1 rotate-0 transform duration-200 group-open:rotate-90" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7" />
                        </svg>
                        View Traffic Analysis
                    </div>
                </summary>
                <div class="px-4 py-2 border-b border-white/10">
                    <div class="grid grid-cols-2 text-sm font-semibold text-gray-400">
                        <div>Time Period</div>
                        <div class="text-right">Request Count</div>
                    </div>
                </div>
                <div id="traffic-list" class="px-4 py-2 space-y-1 text-sm text-gray-300"></div>
                <div class="px-4 py-3 text-center">
                    <button id="load-more-traffic" class="px-4 py-2 bg-blue-700 hover:bg-blue-600 rounded text-sm hidden transition-colors duration-200">
                        Load More Traffic Data
                    </button>
                </div>
            </details>
        </section>
    </div>

    <script>
        const ipCount = document.getElementById('ip-count');
        const requestCount = document.getElementById('request-count');
        const errorCount = document.getElementById('error-count');
        const timeCount = document.getElementById('time-count');
        const reportDate = document.getElementById('report-date');

        const ipList = document.getElementById('ip-list');
        const codesList = document.getElementById('codes-list');
        const filesList = document.getElementById('files-list');
        const toolsList = document.getElementById('tools-list');
        const trafficList = document.getElementById('traffic-list');

        const loadMoreIPs = document.getElementById('load-more-ips');
        const loadMoreCodes = document.getElementById('load-more-codes');
        const loadMoreFiles = document.getElementById('load-more-files');
        const loadMoreTools = document.getElementById('load-more-tools');
        const loadMoreTraffic = document.getElementById('load-more-traffic');
        
        const ITEMS_PER_PAGE = 100;
        let currentData = {
            ips: { items: [], index: 0 },
            codes: { items: [], index: 0 },
            files: { items: [], index: 0 },
            tools: { items: [], index: 0 },
            traffic: { items: [], index: 0 }
        };

        function loadMoreItems(type, list, button) {
            const data = currentData[type];
            const endIndex = Math.min(data.index + ITEMS_PER_PAGE, data.items.length);
            
            for (let i = data.index; i < endIndex; i++) {
                const item = data.items[i];
                const entry = document.createElement('div');
                entry.className = 'py-1 grid';
                
                switch(type) {
                    case 'ips':
                        entry.className += ' grid-cols-2';
                        entry.innerHTML = `
                            <div>${item.ip}</div>
                            <div class="text-right">${item.requests}</div>
                        `;
                        break;
                    case 'codes':
                        entry.className += ' grid-cols-2';
                        entry.innerHTML = `
                            <div>${item.code}</div>
                            <div class="text-right">${item.count}</div>
                        `;
                        break;
                    case 'files':
                        entry.className += ' grid-cols-3';
                        entry.innerHTML = `
                            <div class="col-span-2">${item.file}</div>
                            <div class="text-right">${item.count}</div>
                        `;
                        break;
                    case 'tools':
                        entry.className += ' grid-cols-2';
                        entry.innerHTML = `
                            <div>${item.tool}</div>
                            <div class="text-right">${item.count}</div>
                        `;
                        break;
                    case 'traffic':
                        entry.className += ' grid-cols-2';
                        entry.innerHTML = `
                            <div>${item.time}</div>
                            <div class="text-right">${item.count}</div>
                        `;
                        break;
                }
                
                list.appendChild(entry);
            }
            
            data.index = endIndex;
            
            if (data.index >= data.items.length) {
                button.classList.add('hidden');
            }
        }

        // Load stats
        fetch('stats.json')
            .then(response => response.json())
            .then(stats => {
                ipCount.innerText = stats.ip_count;
                requestCount.innerText = stats.request_count;
                errorCount.innerText = stats.error_count;
                timeCount.innerText = stats.asset_count;
                reportDate.innerText = stats.report_date;
            })
            .catch(error => {
                console.error('Error loading stats:', error);
                ipCount.innerText = '0';
                requestCount.innerText = '0';
                errorCount.innerText = '0';
                timeCount.innerText = '0';
                reportDate.innerText = 'N/A';
            });

        // Load IPs
        fetch('ips.json')
            .then(response => response.json())
            .then(data => {
                currentData.ips.items = data;
                loadMoreItems('ips', ipList, loadMoreIPs);
                if (data.length > ITEMS_PER_PAGE) {
                    loadMoreIPs.classList.remove('hidden');
                }
            });

        // Load Response Codes
        fetch('codes.json')
            .then(response => response.json())
            .then(data => {
                currentData.codes.items = data;
                loadMoreItems('codes', codesList, loadMoreCodes);
                if (data.length > ITEMS_PER_PAGE) {
                    loadMoreCodes.classList.remove('hidden');
                }
            });

        // Load Files
        fetch('files.json')
            .then(response => response.json())
            .then(data => {
                currentData.files.items = data;
                loadMoreItems('files', filesList, loadMoreFiles);
                if (data.length > ITEMS_PER_PAGE) {
                    loadMoreFiles.classList.remove('hidden');
                }
            });

        // Load Tools
        fetch('tools.json')
            .then(response => response.json())
            .then(data => {
                currentData.tools.items = data;
                loadMoreItems('tools', toolsList, loadMoreTools);
                if (data.length > ITEMS_PER_PAGE) {
                    loadMoreTools.classList.remove('hidden');
                }
            });

        // Load Traffic
        fetch('traffic.json')
            .then(response => response.json())
            .then(data => {
                currentData.traffic.items = data;
                loadMoreItems('traffic', trafficList, loadMoreTraffic);
                if (data.length > ITEMS_PER_PAGE) {
                    loadMoreTraffic.classList.remove('hidden');
                }
            });

        // Add event listeners
        loadMoreIPs.addEventListener('click', () => loadMoreItems('ips', ipList, loadMoreIPs));
        loadMoreCodes.addEventListener('click', () => loadMoreItems('codes', codesList, loadMoreCodes));
        loadMoreFiles.addEventListener('click', () => loadMoreItems('files', filesList, loadMoreFiles));
        loadMoreTools.addEventListener('click', () => loadMoreItems('tools', toolsList, loadMoreTools));
        loadMoreTraffic.addEventListener('click', () => loadMoreItems('traffic', trafficList, loadMoreTraffic));
    </script>
</body>

</html>
